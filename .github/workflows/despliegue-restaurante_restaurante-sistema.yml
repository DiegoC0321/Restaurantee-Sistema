# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - Restaurante-Sistema

on:
  push:
    branches:
      - 'despliegue-restaurante'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Next.js installation
        run: |
          npm ls next
          test -f node_modules/.bin/next

      - name: Build Next.js application
        run: npm run build

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          include-hidden-files: true
          path: |
            .next/**
            public/**
            package.json
            package-lock.json
            next.config.js
            src/**
            scripts/**
            node_modules/**

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4F6435BE2EB84E36AFEAB7ACEDC1DA7A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B531FD375A144B0F82ECAA2871B1995C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8F1A3954329048DBAC1806BF05D36D1F }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Restaurante-Sistema'
          slot-name: 'Production'
          package: .